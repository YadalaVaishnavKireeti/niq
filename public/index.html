<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Live quiz scoreboard">
    <title>The Score Board</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="dashboard">
    <header class="scoreboard-header">

    <div class="logo-placeholder left-logo">
        <img
            src="/images/left-logo.png"
            alt="Left Logo"
        >
    </div>

    <h1>
        THE SCOREBOARD
    </h1>

    <div class="logo-placeholder right-logo">
        <img
            src="/images/right-logo.png"
            alt="Right Logo"
        >
    </div>

</header>

    <section class="current-round" aria-live="polite">
        <span>CURRENT ROUND</span>
        <strong id="current-round">Loading...</strong>
        <span class="live-indicator">
            <span class="live-dot"></span>
            LIVE
        </span>
    </section>

    <section class="dashboard-audio-panel" aria-label="Answer sound controls">
        <div class="dashboard-audio-title">🎵 ANSWER SOUNDS</div>
        <div class="dashboard-audio-buttons">
            <button type="button" class="dashboard-audio-button correct" data-audio="correct-answer">👏 Correct Answer</button>
            <button type="button" class="dashboard-audio-button wrong" data-audio="wrong-answer">❌ Wrong Answer</button>
            <button type="button" class="dashboard-audio-button ready" data-audio="ready-ding">🔔 Bell / Ready</button>
        </div>
        <span class="dashboard-audio-help">Click a sound only when you want it. All three audio files are stored locally in this dashboard.</span>
    </section>

    <section class="leaderboard-section">
        <div class="section-heading">
            <div>
                <span class="eyebrow">CHAMPIONSHIP TABLE</span>
                <h2>Rankings</h2>
            </div>
            <div id="last-updated">Updating...</div>
        </div>
        <div id="leaderboard" aria-live="polite">
            <div class="loading">Loading leaderboard...</div>
        </div>
    </section>
</main>
<script src="/app.js?v=answer-audio-v1"></script>
</body>
</html>
