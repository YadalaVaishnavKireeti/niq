<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Live quiz scoreboard">
    <title>The Score Board</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="dashboard">
    <header class="scoreboard-header">
        <div class="logo-placeholder left-logo">LOGO</div>
        <h1>THE SCORE BOARD</h1>
        <div class="logo-placeholder right-logo">LOGO</div>
    </header>

    <section class="current-round" aria-live="polite">
        <span>CURRENT ROUND</span>
        <strong id="current-round">Loading...</strong>
        <span class="live-indicator">  <span class="live-dot"></span>LIVE </span>
    </section>

    <section class="leaderboard-section">
        <div class="section-heading">
            <div>
                <span class="eyebrow">CHAMPIONSHIP TABLE</span>
                <h2>Rankings</h2>
            </div>
            <div id="last-updated">Updating...</div>
        </div>
        <div id="leaderboard" aria-live="polite">
            <div class="loading">Loading leaderboard...</div>
        </div>
    </section>
</main>
<script src="/app.js"></script>
</body>
</html>
